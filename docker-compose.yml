version: "3.9"

services:

  backend:

    build: ./backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    env_file:
      - ./backend/.env

    depends_on:
      - redis

  frontend:

    build: ./frontend

    ports:
      - "3000:3000"

    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend

  redis:

    image: redis:latest

    ports:
      - "6379:6379"
