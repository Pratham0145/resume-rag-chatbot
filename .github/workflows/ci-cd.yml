name: Resume RAG Chatbot CI/CD

on:

  push:
    branches:
      - main


jobs:

  build-and-push:

    runs-on: ubuntu-latest


    steps:

      # ==============================
      # Checkout Repository
      # ==============================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==============================
      # Login to Docker Hub
      # ==============================

      - name: Login to Docker Hub
        uses: docker/login-action@v3

        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      # ==============================
      # Build Backend Docker Image
      # ==============================

      - name: Build Backend Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/rag-backend ./backend


      # ==============================
      # Push Backend Docker Image
      # ==============================

      - name: Push Backend Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/rag-backend


      # ==============================
      # Build Frontend Docker Image
      # ==============================

      - name: Build Frontend Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/rag-frontend ./frontend


      # ==============================
      # Push Frontend Docker Image
      # ==============================

      - name: Push Frontend Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/rag-frontend